<VirtualHost *:${APACHE_PORT}>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
    </Directory>
    <DirectoryMatch "^/var/www/html/(libraries|templates|vendor|tmp|setup|test)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(composer\.(json|lock)|\.ht.*)$">
        Require all denied
    </FilesMatch>
    ProxyTimeout 600
</VirtualHost>
